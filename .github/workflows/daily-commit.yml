name: Daily Auto Commit

on:
  schedule:
    - cron: '0 3,9,15,21 * * *'   # UTC 03:00, 09:00, 15:00, 21:00 — din e 4 bar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update file
        run: |
          echo "Last update: $(date -u)" >> daily-log.txt

      - name: Commit and Push
        run: |
          git config user.name "fs-shariyar-bd"
          git config user.email "261887378+fs-shariyar-bd@users.noreply.github.com"
          git add daily-log.txt
          git diff --staged --quiet && exit 0
          git commit -m "Auto commit: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
